<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="navbar">
    👤 User Dashboard

    <button class="logout-btn"
            style="margin-right: 10px; background: #17a2b8;"
            onclick="loadMyTickets()">
        🎫 My Tickets
    </button>
    
    <button class="logout-btn"
            onclick="logout()">
        Logout
    </button>
</div>

<div class="container">

    <h2 class="title">
        Search Available Buses
    </h2>

    <div class="search-box">

        <input
                type="text"
                id="source"
                placeholder="Enter Source">

        <input
                type="text"
                id="destination"
                placeholder="Enter Destination">

        <button
                class="btn"
                onclick="searchBus()">

            Search Bus

        </button>

        <button
                class="btn"
                onclick="loadAllBuses()"
                style="margin-top:10px;">

            Show All Buses

        </button>

    </div>

    <div id="message"></div>

    <h2 class="title">
        Available Buses
    </h2>

    <div
            class="bus-container"
            id="busContainer">

    </div>

</div>

<script>

    const token =
        new URLSearchParams(window.location.search)
            .get("token");

    /* Dashboard open aana udane buses load */
    loadAllBuses();

    /* Load All Buses */

    function loadAllBuses()
    {
        fetch("/bus",
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            })

            .then(res => {
                console.log("STATUS =", res.status);
                return res.json();
            })
            .then(data => {

                let html = "";

                if(data.length === 0)
                {
                    html =
                        "<h3 style='color:red'>No Buses Available</h3>";
                }

                data.forEach(bus => {

                    html += `

            <div class="bus-card">

                <h3>${bus.busName}</h3>

                <p>
                📍 ${bus.source}
                →
                ${bus.destination}
                </p>

                <p>
                🕒 ${bus.departureTime} | 📅 ${bus.departureDate}
                </p>

                <p>
                💺 Available Seats :
                ${bus.seats}
                </p>

                <br>

                <button
                class="btn"
                onclick="showBookingForm(${bus.id})">

                Book Now

                </button>

            </div>

            `;
                });

                document.getElementById(
                    "busContainer")
                    .innerHTML = html;
            })
    .then(res => res.text())
        .then(data => {
            console.log(data);

            document.getElementById("message")
                .innerHTML =
                `
    <div class="card">
        <h2 class="success">
        ✅ Ticket Booked Successfully
        </h2>
    </div>
    `;
        });
    }

    /* Search Bus */

    function searchBus()
    {
        let source =
            document.getElementById("source").value;

        let destination =
            document.getElementById("destination").value;

        fetch(
            `/bus/search?source=${source}&destination=${destination}`,
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        )

            .then(res => res.json())

            .then(data => {

                let html = "";

                if(data.length === 0)
                {
                    html =
                        "<h3 style='color:red'>No Buses Found</h3>";
                }

                data.forEach(bus => {

                    html += `

            <div class="bus-card">

                <h3>
                ${bus.busName}
                </h3>

                <p>
                📍 ${bus.source}
                →
                ${bus.destination}
                </p>

                <p>
                🕒 ${bus.departureTime} | 📅 ${bus.departureDate}
                </p>

                <p>
                💺 Available Seats :
                ${bus.seats}
                </p>

                <br>

                <button
                class="btn"
                onclick="showBookingForm(${bus.id})">

                Book Now

                </button>

            </div>

            `;
                });

                document.getElementById(
                    "busContainer")
                    .innerHTML = html;
            });
    }

    /* Booking Form */

    function showBookingForm(busId)
    {
        document.getElementById("message")
            .innerHTML = `

    <div class="card">

        <h3>Book Ticket</h3>

        <input
        type="text"
        id="passengerName"
        placeholder="Passenger Name">

        <input
        type="text"
        id="mobileNumber"
        placeholder="Mobile Number">

        <input
        type="number"
        id="seatsBooked"
        placeholder="Seats Required">

        <button
        class="btn"
        onclick="bookBus(${busId})">

        Confirm Booking

        </button>

    </div>

    `;
    }

    /* Book Bus */

    function bookBus(busId)
    {
        const passengerName =
            document.getElementById("passengerName").value;

        const mobileNumber =
            document.getElementById("mobileNumber").value;

        const seatsBooked =
            document.getElementById("seatsBooked").value;

        fetch("/booking/book",
            {
                method: "POST",

                headers:
                    {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                body: JSON.stringify(
                    {
                        passengerName: passengerName,
                        mobileNumber: mobileNumber,
                        busId: busId,
                        seatsBooked: parseInt(seatsBooked)
                    })
            })

            .then(response =>
            {
                console.log("STATUS =", response.status);

                if (!response.ok)
                {
                    throw new Error(
                        "Booking Failed : " + response.status
                    );
                }

                return response.json();
            })

            .then(data =>
            {
                console.log("BOOKED =", data);

                document.getElementById("message").innerHTML = `
            <div class="card" style="border: 2px dashed #4CAF50; background: #f9fff9;">
                <h2 class="success" style="margin-bottom: 15px;">
                    ✅ Ticket Booked Successfully!
                </h2>
                <div style="text-align: left; background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                    <h3 style="margin: 0 0 10px 0; color: #333;">🎫 TICKET RECEIPT</h3>
                    <p><strong>Booking ID:</strong> #${data.id}</p>
                    <p><strong>Passenger:</strong> ${data.passengerName}</p>
                    <p><strong>Mobile:</strong> ${data.mobileNumber}</p>
                    <hr style="margin: 10px 0;">
                    <p><strong>Bus:</strong> ${data.busName}</p>
                    <p><strong>Route:</strong> ${data.source} → ${data.destination}</p>
                    <p><strong>Time:</strong> ${data.departureTime} | <strong>Date:</strong> ${data.departureDate}</p>
                    <p><strong>Seats Booked:</strong> ${data.seatsBooked}</p>
                </div>
                <button class="btn" style="margin-top: 15px;" onclick="document.getElementById('message').innerHTML=''">Close</button>
            </div>
        `;

                loadAllBuses();
            })

            .catch(error =>
            {
                console.error(error);

                document.getElementById("message").innerHTML = `
            <div class="card">
                <h2 style="color:red">
                    ❌ Booking Failed
                </h2>
                <p>${error.message}</p>
            </div>
        `;
            });
    }
    function loadMyTickets() {
        document.getElementById("message").innerHTML = "";
        fetch("/booking/my-bookings", {
            headers: {
                Authorization: "Bearer " + token
            }
        })
        .then(res => res.json())
        .then(data => {
            let html = "<h2 class='title'>🎫 My Tickets</h2>";
            
            if(data.length === 0) {
                html += "<h3 style='color:gray; text-align:center;'>No tickets booked yet.</h3>";
            }
            
            data.forEach(ticket => {
                html += `
                <div class="card" style="border: 2px solid #17a2b8; text-align: left; margin-bottom: 15px;">
                    <h3 style="margin: 0 0 10px 0; color: #17a2b8;">Booking #${ticket.id}</h3>
                    <p><strong>Passenger:</strong> ${ticket.passengerName} (${ticket.mobileNumber})</p>
                    <hr style="margin: 10px 0;">
                    <p><strong>Bus:</strong> ${ticket.busName}</p>
                    <p><strong>Route:</strong> ${ticket.source} → ${ticket.destination}</p>
                    <p><strong>Time:</strong> ${ticket.departureTime} | <strong>Date:</strong> ${ticket.departureDate}</p>
                    <p><strong>Seats Booked:</strong> ${ticket.seatsBooked}</p>
                </div>
                `;
            });
            
            document.getElementById("busContainer").innerHTML = html;
        });
    }

    function logout()
    {
        window.location.href="/";
    }

</script>

</body>
</html>
